name: Checkmarx 
on:
  push:
    branches: [net-new-vulns]
  workflow_dispatch:

jobs:
  checkmarx-scan:
    runs-on: ubuntu-latest  
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Checkmarx AST Github Action
        uses: Checkmarx/ast-github-action@2.3.47
        with:
          project_name: 'cx-devsecops/vuln-php-project01'
          cx_tenant: 'ferreiralucas-sedemo'
          base_uri: 'https://us.ast.checkmarx.net'
          cx_client_id: 'github-actions-client'
          cx_client_secret: 'JQIhcqTFiIgp7fcAL9l14RsA2syxPR7rKP8rpR36Y8QYxIPJSP0ZtREbWHcd725Y6J71CaFzG8sCJB2PLxqvXy'
          branch: ${{ github.ref }}
          scan_params: '--scan-types sast --sast-incremental=false' 